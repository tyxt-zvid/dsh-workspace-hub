<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>工作区中枢 · 交互原型</title>
<style>
/* ============================================================
   工作区中枢 · Graphite Console 原型
   DSH-native tokens · dark first · hairline density
   ============================================================ */

/* ---- tokens: light (default) ---- */
:root{
  --bg:#ffffff;
  --layer-1:#ffffff;
  --layer-2:#f9fafb;
  --layer-3:#ebeef2;
  --fg:#0f1115;
  --fg-2:#61666b;
  --fg-3:#81858c;
  --border:#0000000a;
  --border-strong:#0000001a;
  --accent-ink:#0f1115;
  --accent-on:#ffffff;
  --blue:#4176e6;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#ec1313;
  --hover:#2631480f;
  --active:#2631481a;
  --toast-bg:#353638;
  --fg-deco:#81858c;
  --amber-text:#b45309;
  --green-icon:#15803d;
  --backdrop:#f2f3f5;
  --scrim:rgba(0,0,0,.28);
  --shadow:0 24px 64px rgba(0,0,0,.18);
  --focus:0 0 0 2px var(--blue);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --t1:100ms; --t2:160ms; --t3:200ms;
  --ease:cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}

/* ---- tokens: dark ---- */
[data-theme="light"]{
  /* light-theme legibility override (pending host token fix) */
  --fg-3:#61666b;
  --fg-deco:#81858c;
  --amber-text:#b45309;
  --green-icon:#15803d;
  --border-strong:#00000029;
}

[data-theme="dark"]{
  --bg:#151517;
  --layer-1:#232324;
  --layer-2:#2c2c2e;
  --layer-3:#353638;
  --fg:#f9fafb;
  --fg-2:#cfd3d6;
  --fg-3:#adb2b8;
  --border:#ffffff0f;
  --border-strong:#ffffff1f;
  --accent-ink:#f9fafb;
  --accent-on:#0f1115;
  --blue:#7aaaff;
  --green:#22c55e;
  --amber:#f59e0b;
  --red:#f25a5a;
  --hover:#ffffff14;
  --active:#ffffff24;
  --toast-bg:#2c2c2e;
  --fg-deco:#adb2b8;
  --amber-text:#f59e0b;
  --green-icon:#22c55e;
  --backdrop:#0b0b0c;
  --scrim:rgba(0,0,0,.42);
  --shadow:0 24px 64px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---- base ---- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--backdrop);
  color:var(--fg);
  font-family:var(--font);
  font-size:13px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background var(--t3) var(--ease);
}
[hidden]{display:none!important}
button{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,p{margin:0}
svg{display:block}
::selection{background:var(--active)}
:where(button,input,textarea,select,a,summary):focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--blue)}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---- app frame ---- */
.app{min-height:100%;display:flex;align-items:center;justify-content:center;padding:8px 16px}
.panel{
  position:relative;
  display:flex;flex-direction:column;
  width:min(1080px,100%);
  height:min(900px,calc(100vh - 16px));
  min-height:520px;
  background:var(--bg);
  border:1px solid var(--border-strong);
  border-radius:12px;
  overflow:hidden;
  transition:background var(--t2) var(--ease),border-color var(--t2) var(--ease);
}
.ic{display:block;flex:none}
.spacer{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:11px;color:var(--fg-3)}
.kbd{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:16px;height:16px;padding:0 4px;
  border:1px solid var(--border-strong);border-radius:4px;
  background:var(--layer-2);
  font:11px/1 var(--mono);color:var(--fg-3);
}

/* ---- header ---- */
.hd{
  flex:none;height:56px;display:flex;align-items:center;gap:12px;
  padding:0 max(24px,calc((100% - 960px)/2));border-bottom:1px solid var(--border);
}
.glyph{
  width:26px;height:26px;flex:none;border-radius:8px;
  background:var(--layer-2);border:1px solid var(--border-strong);
  display:grid;place-items:center;color:var(--fg-2);
}
.hd-id{min-width:0}
.hd-title{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600;line-height:21px;color:var(--fg)}
.hd-ws{font-size:12px;font-weight:400;color:var(--fg-3)}
.hd-path{display:flex;align-items:center;gap:2px;margin-top:1px;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--fg-3)}
.hd-path .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.icon-btn{
  width:28px;height:28px;flex:none;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg-2);transition:background var(--t1) var(--ease),color var(--t1) var(--ease);
}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn.xs{width:24px;height:24px;border-radius:8px;color:var(--fg-3)}
.icon-btn.sm{width:24px;height:24px;border-radius:8px;color:var(--fg-3)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.sync{height:24px;padding:0 6px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sync:hover{background:var(--hover);color:var(--fg-2)}
.sync .ic{color:var(--fg-3)}
.sync.warn{color:var(--amber)}
.key-btn{
  height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--border-strong);
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease);
}
.key-btn:hover{background:var(--hover);color:var(--fg)}
.key-btn .ic{color:var(--fg-3)}
.theme-seg{display:inline-flex;align-items:center;gap:1px;height:24px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--layer-2)}
.theme-seg button{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--fg-3)}
.theme-seg button:hover{color:var(--fg-2)}
.theme-seg button.on{background:var(--layer-3);color:var(--fg)}
.back{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 4px;border-radius:8px;font-size:13px;color:var(--fg-2)}
.back:hover{background:var(--hover);color:var(--fg)}

/* ---- status strip ---- */
.strip{
  flex:none;height:36px;display:flex;align-items:center;gap:2px;
  padding:0 max(24px,calc((100% - 960px)/2));border-bottom:1px solid var(--border);
  font-size:12px;line-height:1.5;color:var(--fg-2);
}
.strip .item{height:22px;padding:0 6px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);white-space:nowrap}
.strip .item:hover{background:var(--hover);color:var(--fg)}
.strip .item .v{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:500}
.strip .sep{color:var(--fg-3);opacity:.55;font-size:11px;padding:0 1px}
.strip .live{display:inline-flex;align-items:center;gap:5px}

/* ---- nav ---- */
.navwrap{flex:none}
.nav{height:40px;display:flex;align-items:stretch;gap:0;padding:0 max(16px,calc((100% - 960px)/2));border-bottom:1px solid var(--border)}
.nav button{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  padding:0 12px;font-size:13px;line-height:1.4;color:var(--fg-2);
  transition:color var(--t1) var(--ease);
}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--fg);font-weight:600}
.nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--fg)}
.nav .n{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;font-weight:400}
.nav .att{width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:1px}

/* ---- content shells ---- */
.content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:12px max(24px,calc((100% - 960px)/2)) 24px}
.view-foot{
  flex:none;height:32px;display:flex;align-items:center;gap:10px;
  padding:0 max(24px,calc((100% - 960px)/2));border-top:1px solid var(--border);
  font-size:12px;line-height:1.5;color:var(--fg-3);
}
.view-foot .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.view-foot .spacer{flex:1}
.view-foot .keys{display:flex;align-items:center;gap:6px;white-space:nowrap}
.view-foot .keys .kbd{margin-right:1px}

/* ---- group container + rows ---- */
.group{border:1px solid var(--border);border-radius:12px;background:var(--layer-1);overflow:hidden}
.group + .group{margin-top:8px}
.row{
  position:relative;display:flex;align-items:center;gap:10px;
  height:44px;padding:0 8px 0 10px;
  border-top:1px solid var(--border);border-top:.5px solid var(--border);
  background:transparent;
  transition:background var(--t1) var(--ease);
}
.group > .row:first-child,.group > .row-wrap:first-child .row{border-top:0}
.row.two{height:56px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--active)}
.row-wrap + .row-wrap .row{border-top:1px solid var(--border);border-top:.5px solid var(--border)}
.row-main{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.row-title{
  font-size:14px;font-weight:500;line-height:1.4;color:var(--fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row-title.done{text-decoration:line-through;text-decoration-color:var(--fg-3);color:var(--fg-3);font-weight:400}
.row-sub{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--fg-3);line-height:1.5;overflow:hidden}
.row-sub > span{white-space:nowrap}
.row-sub > .ellip{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.row-sub .ellip{max-width:100%}
.row-sub .sepdot{opacity:.5}
.row-meta{flex:none;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums;margin-left:auto}
.row-meta .who{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{
  position:absolute;right:6px;top:0;bottom:0;
  display:flex;align-items:center;gap:2px;
  opacity:0;pointer-events:none;
  transition:opacity var(--t1) var(--ease);
  background:var(--hover);
  border-radius:8px;
}
.row:hover .row-actions,.row:focus-within .row-actions,.row.force .row-actions,.row-actions.always{opacity:1;pointer-events:auto}
.row:hover .row-meta,.row:focus-within .row-meta,.row.force .row-meta{visibility:hidden}
.row:focus-visible .row-actions{opacity:1;pointer-events:auto}
.mini{
  height:24px;padding:0 8px;border-radius:8px;
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--fg-2);white-space:nowrap;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease);
}
.mini:hover{background:var(--active);color:var(--fg)}
.mini.danger:hover{color:var(--red)}
.row-sel{width:24px;height:24px;flex:none;display:grid;place-items:center;opacity:0;transition:opacity var(--t1) var(--ease)}
.row:hover .row-sel,.row:focus-within .row-sel,.row.sel .row-sel,.row.force .row-sel{opacity:1}
input[type="checkbox"]{
  appearance:none;width:14px;height:14px;flex:none;margin:0;
  border:1px solid var(--border-strong);border-radius:4px;background:var(--layer-1);
  display:inline-grid;place-items:center;cursor:pointer;
  transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease);
}
input[type="checkbox"]:checked{background:var(--accent-ink);border-color:var(--accent-ink)}
input[type="checkbox"]:checked::after{content:"";width:7px;height:4px;border-left:1.5px solid var(--accent-on);border-bottom:1.5px solid var(--accent-on);transform:rotate(-45deg) translateY(-1px)}
.status{
  width:28px;height:28px;flex:none;border-radius:4px;
  display:grid;place-items:center;color:var(--fg-3);
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease);
}
.status:hover{background:var(--active);color:var(--fg-2)}
.status.doing{color:var(--blue)}
.status.blocked{color:var(--amber)}
.status.done{color:var(--green-icon)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--fg-3)}
.dot.todo{background:transparent;border:1px solid var(--fg-3);box-sizing:border-box}
.dot.doing{background:var(--blue)}
.dot.blocked{background:var(--amber)}
.dot.done{background:var(--green)}
.dot.closed{background:transparent;border:1px solid var(--fg-3);box-sizing:border-box}
.dot.starting{background:var(--amber)}
.dot.failed{background:var(--red)}
.dot.ok{background:var(--green)}
.dot.warn{background:var(--amber)}
.dot.err{background:var(--red)}
.dot.idle{background:transparent;border:1px solid var(--fg-3);box-sizing:border-box}
.pulse{position:relative;width:6px;height:6px;flex:none;border-radius:50%;background:var(--blue)}
.pulse::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:1px solid var(--blue);opacity:.5;
  animation:pulse 2s var(--ease) infinite;
}
.pri{display:inline-flex;align-items:center;gap:4px;flex:none}
.pri .dot{width:6px;height:6px}
.pri.high{color:var(--amber-text)}
.pri.high .dot{background:var(--amber)}
.badge{
  display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;
  border:1px solid var(--border-strong);border-radius:4px;
  background:var(--layer-2);font-size:11px;line-height:1.4;color:var(--fg-3);white-space:nowrap;flex:none;
}
.badge.accent{color:var(--fg-2)}
.badge.unread{color:var(--fg);border-color:var(--border-strong);background:var(--layer-3);font-weight:500;padding:0 7px}
.badge .dot{width:5px;height:5px;background:var(--fg-3)}
.url{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--fg-2);background:none;border:0;padding:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url:hover{color:var(--fg);text-decoration:underline;text-underline-offset:2px}

/* ---- buttons ---- */
.btn{
  height:28px;padding:0 10px;border-radius:8px;
  border:1px solid var(--border-strong);background:transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;color:var(--fg-2);white-space:nowrap;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease),border-color var(--t1) var(--ease);
}
.btn:hover{background:var(--hover);color:var(--fg)}
.btn:active{background:var(--active)}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:8px;gap:4px}
.btn.lg{height:32px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent-on);font-weight:500}
.btn.primary:hover{background:var(--accent-ink);color:var(--accent-on);opacity:.9}
.btn.primary:active{opacity:.82}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--fg-2)}
.btn.danger:hover{color:var(--red);border-color:var(--border-strong);background:var(--hover)}

/* ---- toolbar / chips / fields ---- */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.chips{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.chip{
  height:26px;padding:0 8px;border-radius:8px;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--fg-2);white-space:nowrap;
  transition:background var(--t1) var(--ease),color var(--t1) var(--ease);
}
.chip:hover{background:var(--hover);color:var(--fg)}
.chip.on{background:var(--layer-3);color:var(--fg);border-color:var(--border)}
.chip .n{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.chip.on .n{color:var(--fg-2)}
.ctl{
  height:28px;padding:0 8px;border-radius:8px;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;color:var(--fg-3);white-space:nowrap;
}
.ctl:hover{background:var(--hover);color:var(--fg-2)}
.ctl .ic{color:var(--fg-3)}
.seg{display:inline-flex;align-items:center;height:28px;padding:2px;border:1px solid var(--border-strong);border-radius:8px;background:var(--layer-2)}
.seg button{height:22px;padding:0 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg-3)}
.seg button:hover{color:var(--fg-2)}
.seg button.on{background:var(--layer-3);color:var(--fg)}
.seg button .ic{color:currentColor}
.btn-row{display:flex;align-items:center;gap:6px}
.field{position:relative;display:flex;align-items:center;min-width:0}
.field > .ic{position:absolute;left:9px;color:var(--fg-3);pointer-events:none}
.input{
  width:100%;height:32px;padding:0 10px;
  background:var(--layer-2);border:1px solid var(--border-strong);border-radius:8px;
  font-size:13px;color:var(--fg);outline:none;
  transition:border-color var(--t1) var(--ease),box-shadow var(--t1) var(--ease);
}
.input::placeholder{color:var(--fg-3)}
.input:focus{border-color:var(--blue);box-shadow:var(--focus)}
.field .input{padding-left:30px}
textarea.input{height:auto;min-height:72px;padding:8px 10px;line-height:1.7;resize:vertical}
select.input{height:28px;padding:0 6px;font-size:12px;background:var(--layer-1)}

/* ---- quick capture ---- */
.capture{
  display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;
  border:1px solid var(--border-strong);border-radius:8px;background:var(--layer-2);
  transition:border-color var(--t1) var(--ease),box-shadow var(--t1) var(--ease);
}
.capture:focus-within{border-color:var(--blue);box-shadow:var(--focus)}
.capture .ic{color:var(--fg-3)}
.capture input{
  flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;
  font-size:13px;color:var(--fg);
}
.capture input::placeholder{color:var(--fg-3)}
.capture .kbd{flex:none}

/* ---- sections ---- */
.sec{margin-bottom:20px}
.sec:last-child{margin-bottom:0}
.sec-hd{display:flex;align-items:center;gap:8px;height:28px;margin-bottom:2px;padding:0 2px}
.sec-hd h2{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--fg-3);line-height:1.4}
.sec-hd .more{margin-left:auto;font-size:12px;color:var(--fg-3);display:inline-flex;align-items:center;gap:3px;padding:2px 4px;border-radius:4px}
.sec-hd .more:hover{color:var(--fg-2);background:var(--hover)}
.gh{
  display:flex;width:100%;align-items:center;gap:6px;
  height:28px;padding:0 4px 0 2px;
  font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--fg-3);
}
.gh:hover{color:var(--fg-2)}
.gh .chev{color:var(--fg-3);transition:transform var(--t2) var(--ease)}
.gh.collapsed .chev{transform:rotate(-90deg)}
.gh .n{margin-left:auto;font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--fg-3)}
.att-icon{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--fg-deco)}
.att-row .row-title{font-weight:500}
.att-row .row-sub .dot{margin-right:1px}
.att-row .act{margin-left:auto;flex:none;display:flex;align-items:center;gap:2px}
.att-row .act .go{height:24px;padding:0 6px;display:inline-flex;align-items:center;gap:4px;border-radius:8px;font-size:12px;color:var(--fg-2)}
.att-row .act .go:hover{background:var(--active);color:var(--fg)}
.att-row .act .go .ic{color:var(--fg-3)}
.att-row .row-actions{background:var(--hover)}

/* ---- expanded task ---- */
.expand{background:var(--layer-2);border-top:1px solid var(--border);padding:12px 14px 14px 56px}
.ex-title-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.title-edit{
  flex:1;min-width:0;height:28px;padding:0 8px;margin-left:0;
  background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;
  font-size:14px;font-weight:500;color:var(--fg);outline:none;
}
.title-edit:hover{border-color:var(--border-strong)}
.title-edit:focus{border-color:var(--blue);box-shadow:var(--focus);background:var(--bg)}
.save-state{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3)}
.edit-mark{flex:none;color:var(--fg-3)}
.save-state .ic{color:var(--green-icon)}
.ex-detail{font-size:13px;line-height:1.7;color:var(--fg-2);max-width:76ch;margin-bottom:10px}
.run-strip{
  display:flex;align-items:center;gap:8px;min-height:34px;
  padding:6px 10px;margin-bottom:10px;
  border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);
}
.run-strip .rs-main{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--fg-2)}
.run-strip .rs-main .muted{color:var(--fg-3)}
.run-strip .rs-main .ellip{max-width:38ch}
.run-strip .btn{margin-left:auto}
.run-strip .btn + .btn{margin-left:0}
.ex-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.ex-notes{margin-top:12px}
.timeline{position:relative;display:flex;flex-direction:column;padding-left:14px;margin-top:2px}
.timeline::before{content:"";position:absolute;left:3px;top:5px;bottom:4px;width:1px;background:var(--border-strong)}
.tl{position:relative;padding:0 0 9px;display:flex;gap:8px;font-size:12px;line-height:1.5;color:var(--fg-3)}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:-14px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--fg-3);border:1px solid var(--layer-2)}
.tl .when{flex:none;font-variant-numeric:tabular-nums;color:var(--fg-3)}
.tl .what{color:var(--fg-2)}

/* ---- footer sync / bulk bar ---- */
.bulk{
  flex:none;display:flex;align-items:center;gap:6px;
  height:40px;padding:0 max(24px,calc((100% - 960px)/2));background:var(--layer-2);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--fg-2);
}
.bulk .n{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;margin-right:2px}
.bulk .spacer{flex:1}
.bulk .mini{height:24px;border:1px solid var(--border-strong);background:var(--layer-1);color:var(--fg-2)}
.bulk .mini:hover{background:var(--hover);color:var(--fg)}
.bulk .mini.danger:hover{color:var(--red)}
.banner{
  display:flex;align-items:center;gap:8px;
  min-height:34px;padding:6px 10px;margin-bottom:10px;
  border:1px solid var(--border-strong);border-radius:8px;
  background:var(--layer-2);font-size:12px;color:var(--fg-2);
}
.banner .ic{color:var(--amber-text)}
.banner .link{color:var(--fg-2);padding:0 2px}
.banner .link:hover{color:var(--fg);text-decoration:underline;text-underline-offset:2px}
.banner .spacer{flex:1}
.conflict{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 10px;margin:0 0 8px 44px;
  border:1px solid var(--border-strong);border-radius:8px;background:var(--layer-2);
  font-size:12px;line-height:1.5;color:var(--fg-2);
}
.conflict .ic{color:var(--amber-text)}
.conflict .cf-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.conflict .cf-sub{color:var(--fg-3);font-size:11px}
.conflict .cf-main .t{color:var(--fg)}
.conflict .btn{margin-left:auto}
.conflict .btn + .btn{margin-left:0}
.row.hl{animation:hl 420ms var(--ease)}
.run-chip{height:18px;gap:5px;color:var(--fg-3)}
.run-chip .dot{background:var(--fg-3);width:5px;height:5px}
.stopped{color:var(--fg-3)}

/* ---- empty / templates ---- */
.empty{padding:34px 12px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.empty > .ic{color:var(--fg-3)}
.empty-title{font-size:14px;font-weight:500;color:var(--fg);margin-top:4px}
.empty-sub{font-size:13px;line-height:1.7;color:var(--fg-3);max-width:42ch}
.templates{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.tpl{height:26px;padding:0 9px;border:1px solid var(--border-strong);border-radius:8px;font-size:12px;color:var(--fg-2);background:var(--layer-1)}
.tpl:hover{background:var(--hover);color:var(--fg)}

/* ---- board ---- */
.board-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.board-head{flex:none;display:flex;align-items:center;gap:8px;padding:10px max(24px,calc((100% - 960px)/2)) 6px}
.board-head .ttl{font-size:15px;font-weight:600;color:var(--fg)}
.board-head .cnt{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.board{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:4px max(24px,calc((100% - 960px)/2)) 24px;align-items:start}
.col{min-width:0;display:flex;flex-direction:column;gap:6px}
.col-hd{display:flex;align-items:center;gap:6px;height:26px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--fg-2)}
.col-hd .dot{margin-right:1px}
.col-hd .n{margin-left:auto;font-weight:400;letter-spacing:0;color:var(--fg-3);font-variant-numeric:tabular-nums}
.board-filters{flex:none;display:flex;align-items:center;gap:12px;padding:0 max(24px,calc((100% - 960px)/2)) 8px;font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden}
.board-filters .num{color:var(--fg-2);font-variant-numeric:tabular-nums}
.board-filters .spacer{flex:1}
.card{
  position:relative;border:1px solid var(--border-strong);border-radius:12px;background:var(--layer-1);
  padding:8px 9px;cursor:grab;
  transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease);
}
.card:hover{background:var(--hover);border-color:var(--border-strong)}
.card:active{cursor:grabbing}
.card-title{font-size:13px;font-weight:500;line-height:1.4;color:var(--fg);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-title.done{text-decoration:line-through;text-decoration-color:var(--fg-2);text-decoration-thickness:1px;color:var(--fg-3);font-weight:400}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;line-height:1.5;color:var(--fg-3);min-width:0}
.done-check{display:inline-flex;color:var(--green-icon);flex:none}
.card-meta .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .grip{position:absolute;right:5px;top:6px;color:var(--fg-deco);opacity:0;transition:opacity var(--t1) var(--ease)}
.card:hover .grip{opacity:.7}
.card.drop{border-style:dashed;border-color:var(--fg-3);background:var(--layer-2);min-height:44px;display:grid;place-items:center;color:var(--fg-3);font-size:11px;cursor:default}
.col.done .card-title{color:var(--fg-2)}

/* ---- sessions ---- */
.sess-row{height:48px}
.sess-row .row-title{display:flex;align-items:center;gap:6px}
.sub-list{background:var(--bg);border-top:1px solid var(--border)}
.subrow{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 10px 8px 34px;border-top:1px solid var(--border);border-top:.5px solid var(--border);
  transition:background var(--t1) var(--ease);
}
.sub-list .subrow:first-child{border-top:0}
.subrow:hover{background:var(--hover)}
.subrow:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--blue)}
.sub-dot{margin-top:5px}
.sub-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.sub-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;line-height:1.4;color:var(--fg);min-width:0}
.sub-title .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-state{flex:none;font-size:11px;color:var(--fg-3)}
.sub-reply{display:flex;align-items:flex-start;gap:6px;min-width:0;font-family:var(--font);font-size:13px;line-height:1.7;color:var(--fg-2)}
.sub-reply .ic{color:var(--fg-3);margin-top:4px}
.sub-reply .tx{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.7}
.sub-meta{flex:none;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;margin-left:auto;padding-top:1px}
.sub-actions{flex:none;display:flex;align-items:center;gap:2px;margin-top:-2px}
.subrow.closed .sub-title{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--fg-3)}
.composer{display:flex;align-items:center;gap:6px;margin-top:6px}
.composer .input{height:30px;font-size:12px;border-radius:8px}
.composer .btn{flex:none}
.msg-line{display:flex;gap:6px;margin-top:4px;font-size:13px;line-height:1.7;color:var(--fg-2);padding-left:1px}
.msg-line .who{flex:none;color:var(--fg-3)}

/* ---- settings ---- */
.settings .scroll{padding-top:10px;padding-bottom:16px;padding-left:max(24px,calc((100% - 960px)/2));padding-right:max(24px,calc((100% - 960px)/2))}
.page-title{font-size:20px;font-weight:600;line-height:1.4;color:var(--fg)}
.page-sub{font-size:13px;line-height:1.7;color:var(--fg-3);margin:3px 0 14px}
.set-sec{margin-bottom:16px}
.set-sec:last-child{margin-bottom:0}
.set-hd{display:flex;align-items:center;gap:8px;height:26px;margin-bottom:6px;padding:0 2px}
.set-hd h2{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--fg-3)}
.set-hd .hint{margin-left:0}
.set-hd .spacer{flex:1}
.rule-row{padding-right:10px}
.rule-row .rule-ic{color:var(--fg-3);width:20px;height:20px;display:grid;place-items:center;flex:none}
.rule-path{flex:1;min-width:0;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.rule-path bdi{unicode-bidi:plaintext}
.rule-bytes{flex:none;font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;width:52px;text-align:right}
.rule-edit{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3);width:64px;justify-content:flex-end}
.rule-edit .ic{color:var(--fg-3)}
.rule-row.open{background:var(--layer-2);border-bottom:1px solid var(--border)}
.editor{padding:8px 12px 10px 12px;background:var(--layer-2);border-top:1px solid var(--border)}
.ed-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--fg-3);min-width:0}
.ed-path{font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3);margin-left:auto;flex:none}
.saved .ic{color:var(--green-icon)}
.saving{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-3);margin-left:auto;flex:none}
.saving .sp{width:5px;height:5px;border-radius:50%;background:var(--fg-3)}
.mono-input{
  width:100%;min-height:92px;resize:vertical;padding:8px 10px;
  background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;
  font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--fg);outline:none;
  transition:border-color var(--t1) var(--ease),box-shadow var(--t1) var(--ease);
}
.mono-input:focus{border-color:var(--blue);box-shadow:var(--focus)}
.ed-foot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--fg-3)}
.skill-row{height:44px}
.skill-name{flex:none;max-width:220px;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-desc{flex:1;min-width:0;font-size:13px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-face{flex:none;font-size:11px;color:var(--fg-3);width:92px;text-align:right}
.set-search{max-width:280px;margin-bottom:8px}
.task-search{width:190px;flex:none}
.toolbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}

/* ---- states gallery ---- */
.gallery{flex:1;min-height:0;overflow-y:auto;padding:14px max(24px,calc((100% - 960px)/2)) 32px}
.gallery-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.gallery-head .ttl{font-size:15px;font-weight:600;color:var(--fg)}
.gallery-head .sub{font-size:12px;color:var(--fg-3)}
.gal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.gblock{min-width:0}
.glabel{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--fg-3)}
.glabel .n{font-weight:400;letter-spacing:0;color:var(--fg-3);font-variant-numeric:tabular-nums}
.gbody{border:1px solid var(--border);border-radius:12px;background:var(--layer-1);padding:10px 12px;min-height:64px}
.gbody.flush{padding:0;overflow:hidden}
.gbody.dim{color:var(--fg-3)}
.sk-row{display:flex;align-items:center;gap:10px;height:44px;border-top:1px solid var(--border);border-top:.5px solid var(--border);padding:0 12px}
.sk-row:first-child{border-top:0}
.sk{background:var(--layer-3);border-radius:4px;height:8px}
.sk.circle{width:14px;height:14px;border-radius:50%;flex:none}
.sk.w1{width:14px}.sk.w2{width:38%}.sk.w3{width:24%}.sk.w4{width:30%}.sk.w5{width:16%}
.sk-stack{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.offline{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 8px}
.offline .ic{color:var(--fg-3)}
.offline .t{font-size:13px;font-weight:500;color:var(--fg)}
.offline .s{font-size:13px;line-height:1.7;color:var(--fg-3);max-width:36ch}
.inline-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);padding:2px 0}
.inline-note .ic{color:var(--fg-3)}
.long-path{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;text-align:left;margin-top:5px}
.stress-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2)}
.stress-note .num{font-variant-numeric:tabular-nums;color:var(--fg)}

/* ---- overlays ---- */
.overlay{
  position:absolute;inset:0;z-index:40;
  background:var(--scrim);
  display:flex;align-items:center;justify-content:center;
  padding:24px;

}
.overlay.palette-overlay{background:var(--scrim);align-items:flex-start;justify-content:center;padding:56px 16px 24px}
.sheet{
  width:480px;max-width:100%;max-height:calc(100% - 16px);
  display:flex;flex-direction:column;
  background:var(--layer-1);border:1px solid var(--border-strong);border-radius:16px;
  box-shadow:var(--shadow);
}
.sheet:focus{outline:none}
.sheet-hd{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 0 16px}
.sheet-title{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.4;color:var(--fg)}
.sheet-sub{padding:3px 16px 0;font-size:13px;line-height:1.7;color:var(--fg-3)}
.sheet-body{padding:10px 16px 0;overflow-y:auto}
.field-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-3);margin:12px 0 5px;letter-spacing:.02em}
.target{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;margin-top:6px;
  border:1px solid var(--border-strong);border-radius:8px;background:var(--layer-1);
  cursor:pointer;text-align:left;
  transition:background var(--t1) var(--ease),border-color var(--t1) var(--ease);
}
.target:hover{background:var(--hover)}
.target.on{border-color:var(--fg-3);background:var(--layer-2)}
.target .radio{width:14px;height:14px;flex:none;border-radius:50%;border:1px solid var(--fg-3);display:grid;place-items:center}
.target.on .radio{border-color:var(--accent-ink)}
.target.on .radio::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-ink)}
.target-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.target-title{font-size:13px;font-weight:500;color:var(--fg)}
.target-sub{font-size:11px;line-height:1.5;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.target select{flex:none;max-width:180px}
.target.off{opacity:.55}
.sheet .check{display:flex;align-items:center;gap:7px;margin:12px 0 0;font-size:12px;color:var(--fg-2);cursor:pointer}
.sheet-foot{
  display:flex;align-items:center;gap:6px;
  padding:11px 16px 13px;margin-top:14px;border-top:1px solid var(--border);
}
.sheet-foot .hint{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:11px;color:var(--fg-3)}
.sheet-foot .hint .kbd{min-width:14px;height:15px}
.sheet-foot .spacer{flex:1}
.palette{
  width:560px;max-width:100%;
  display:flex;flex-direction:column;
  background:var(--layer-1);border:1px solid var(--border-strong);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;

}
.pal-input{flex:none;display:flex;align-items:center;gap:9px;height:46px;padding:0 14px;border-bottom:1px solid var(--border)}
.pal-input .ic{color:var(--fg-3)}
.pal-input input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:13px;color:var(--fg)}
.pal-input input::placeholder{color:var(--fg-3)}
.pal-input input:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:4px}
.pal-input .kbd{flex:none}
.pal-list{flex:1;min-height:0;max-height:min(540px,62vh);overflow-y:auto;padding:5px 6px 7px}
.pal-group{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--fg-3);padding:8px 8px 4px}
.pal-row{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:8px;
  font-size:13px;color:var(--fg-2);cursor:pointer;min-width:0;
}
.pal-row .ic{color:var(--fg-3)}
.pal-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-row .rt{margin-left:auto;flex:none;font-size:11px;color:var(--fg-3)}
.pal-row.on{background:var(--active);color:var(--fg)}
.pal-row.on .ic{color:var(--fg-2)}
.pal-empty{padding:22px 10px;text-align:center;font-size:12px;color:var(--fg-3)}
.pal-foot{
  flex:none;display:flex;align-items:center;gap:12px;height:34px;padding:0 12px;
  border-top:1px solid var(--border);background:var(--layer-2);
  font-size:11px;color:var(--fg-3);
}
.pal-foot .g{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pal-foot .g .kbd{min-width:14px;height:15px}
.pal-foot .spacer{flex:1}

/* ---- menu / popover / toast ---- */
.menu{
  position:absolute;z-index:70;min-width:186px;max-width:250px;
  background:var(--layer-2);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow);padding:5px;

}
.menu-hd{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--fg-3);padding:5px 8px 4px}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--fg-2)}
.menu-item:hover{background:var(--hover);color:var(--fg)}
.menu-item .ic{color:var(--fg-3)}
.menu-item .hint{margin-left:auto;font-size:11px;color:var(--fg-3);flex:none}
.menu-sep{height:1px;background:var(--border);margin:5px 4px}
.pop{
  position:absolute;z-index:70;top:96px;right:16px;width:372px;max-width:calc(100% - 32px);
  background:var(--layer-2);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;

}
.pop-hd{display:flex;align-items:center;gap:6px;padding:5px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--fg-3)}
.pop-hd .spacer{flex:1}
.pop-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
.pop-row:hover{background:var(--hover)}
.pop-row .pr-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.pop-row .pr-name{font-size:12px;color:var(--fg);display:flex;align-items:center;gap:6px;min-width:0}
.pop-row .pr-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-row .pr-url{font-family:var(--mono);font-size:11px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-row .btn{flex:none}
.pop-foot{border-top:1px solid var(--border);margin-top:4px;padding:6px 4px 2px}
.pop-foot .menu-item{height:26px;font-size:12px}
.toasts{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  width:max-content;max-width:calc(100% - 48px);
}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;
  min-height:36px;padding:7px 10px 7px 12px;
  background:var(--toast-bg);color:var(--fg);border:1px solid var(--border-strong);border-radius:12px;
  box-shadow:var(--shadow);font-size:13px;line-height:1.5;
}
.toast .t-act{flex:none;color:var(--fg);font-size:12px;padding:2px 4px;border-radius:4px;text-decoration:underline;text-underline-offset:2px}
.toast .t-act:hover{text-decoration:underline}
.toast .t-ic{color:var(--fg-2);flex:none}
.toast.error{color:var(--red)}
.toast.error .t-ic{color:var(--red)}
.toasts .spacer{flex:none}

/* ---- animations ---- */
@keyframes pulse{0%{transform:scale(.7);opacity:.6}70%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(-2px)}to{opacity:1;transform:none}}
@keyframes toast-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
@keyframes hl{0%{background:var(--active)}100%{background:transparent}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0ms!important;animation-iteration-count:1!important;transition-duration:0ms!important}
  .pulse::after{animation:none;opacity:.4}
}


/* ---- v2 additions (lead spec pass) ---- */
.row-actions.static{position:static;margin-left:6px;padding-left:2px;background:transparent;opacity:1;pointer-events:auto;flex:none}
.row.always-actions:hover .row-meta,.row.always-actions:focus-within .row-meta{visibility:visible}
.env-row{height:48px}
.capture-detail{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-top:6px;border:1px solid var(--border);border-radius:8px;background:var(--layer-2);font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.capture-detail select{height:26px;border:1px solid var(--border-strong);border-radius:8px;background:var(--layer-1);color:var(--fg-2);font-size:12px;padding:0 6px}
.capture-detail .spacer{flex:1}
.sess-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sess-toolbar .field{width:190px;margin-left:auto}
.sess-search{}
.set-hd .btn{flex:none}
.skill-row .badge{flex:none}
.col-hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .target-select{flex:none;max-width:180px}
@media (max-width:900px){
  .row.always-actions .row-meta{visibility:hidden}
  .sess-toolbar .field{width:100%;margin-left:0}
  .row-actions.static .mini{display:inline-flex}
  .row-actions.static{display:none}
  .row.always-actions{padding-right:8px}
  .att-row .act .go .ic{display:none}
}

.ws-switch{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:400;color:var(--fg-3);border:1px solid transparent;margin-left:2px}
.ws-switch:hover{background:var(--hover);color:var(--fg-2);border-color:var(--border)}
.ws-switch .ic{color:var(--fg-3)}
.ws-check{margin-left:auto;color:var(--fg-2)}
.env-row.failed{height:auto;min-height:58px;padding:7px 8px 7px 10px;align-items:flex-start}
.env-row.failed .dot{margin-top:6px}
.env-error{font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.env-error .e1{color:var(--fg-2)}
.env-row .row-main{gap:1px}
.env-actions{display:flex;align-items:center;gap:2px;flex:none;margin-left:6px}
.env-actions .mini{height:24px}
.server-state{display:inline-flex;align-items:center;gap:4px}
.flip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 4px;border-radius:4px;font-size:12px;color:var(--fg-3);cursor:pointer;user-select:none}
.flip input{width:26px;height:14px;border-radius:8px;position:relative;background:var(--layer-3);transition:background var(--t1) var(--ease)}
.flip input:checked{background:var(--accent-ink)}
.flip input::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--bg);transition:transform var(--t1) var(--ease)}
.flip input:checked::after{transform:translateX(12px)}
.sess-closed-toggle{margin-left:auto}
.editor-conflict{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);font-size:12px;color:var(--fg-2)}
.editor-conflict .ic{color:var(--amber-text)}
.editor-conflict .spacer{flex:1}
.dirty{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-3);margin-left:auto;flex:none}
.dirty .dot{background:var(--amber)}
.kbd-hint{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--fg-3)}
.sessions-note{font-size:12px;color:var(--fg-3);display:flex;align-items:center;gap:6px}
@media (max-width:900px){

  if(state.themeOverride) return state.themeOverride;

function viewSessions(){
  const f = state.sessionFilter || "all";
  const cnt = {
    all: state.showClosed ? state.sessions.length : state.sessions.filter(s => s.status !== "closed").length,
    running: state.sessions.filter(s => s.status === "running").length,
    idle: state.sessions.filter(s => s.status === "idle").length,
    unread: state.sessions.filter(unreadOf).length

  const filtered = state.sessions.filter(s => {
    if(!state.showClosed && s.status === "closed") return false;
    if(f === "running") return s.status === "running";

    if(f === "unread") return unreadOf(s);

function viewHTML(route){
  switch(route){
    case "tasks":
    case "tasks-selected":
    case "tasks-expanded":
    case "dispatch": return viewTasks();
    case "board": return viewBoard();
    case "sessions":
    case "sessions-closed": return viewSessions();
    case "settings": return viewSettings();
    case "states": return viewStates();
    case "now":
    case "now-light":
    case "palette":
    default: return viewNow();
  }
}
function render(opts){
  opts = opts || {};
  applyTheme();
  const route = state.route;
  hdEl.innerHTML = headerHTML(route);
  const shell = route !== "settings";
  stripEl.hidden = !shell;
  navEl.hidden = !shell;
  stripEl.innerHTML = shell ? statusHTML() : "";
  navEl.innerHTML = shell ? navHTML(route) : "";
  contentEl.innerHTML = viewHTML(route);
  renderMenu();
  renderPop();
  renderOverlays();
  renderToasts();
  syncPalAria();
  if(opts.focusSel){
    requestAnimationFrame(() => {
      const el = document.querySelector(opts.focusSel);
      if(!el) return;
      el.focus({preventScroll:true});
      if(opts.caret === "end" && typeof el.setSelectionRange === "function"){
        try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
      }
    });
  }
}
function renderOverlays(){
  const sig = state.sheet.open ? "sheet" : state.palette.open ? "palette" : "";
  const prev = state._overlaySig || "";
  overlayEl.innerHTML = sig === "sheet" ? sheetHTML() : sig === "palette" ? paletteHTML() : "";
  state._overlaySig = sig;
  if(sig && sig !== prev){
    requestAnimationFrame(() => {
      if(sig === "palette"){ const inp = $("#pal-input"); if(inp) inp.focus(); }
      else { const el = $(".sheet"); if(el) el.focus({preventScroll:true}); }
    });
  }
}
function parseRoute(){
  const h = (location.hash || "").replace(/^#\/?/, "");
  return ROUTES.includes(h) ? h : "now";
}
function setRoute(route){
  state.route = route;
  state.themeOverride = FORCED_LIGHT.has(route) ? "light" : null;
  state.palette.open = route === "palette";
  state.sheet.open = route === "dispatch";
  if(route === "dispatch"){ state.sheet.taskId = "t1"; state.sheet.target = 2; }
  if(route === "palette"){ state.palette.query = ""; state.palette.index = 0; }
  if(route === "tasks-expanded"){ state.expanded = new Set(["t3"]); state.selected.clear(); }
  if(route === "tasks" || route === "tasks-expanded"){ state.selected.clear(); }
  if(route === "tasks-selected"){ state.selected = new Set(["t4","t6"]); state.expanded.clear(); }
  if(route === "sessions"){ state.showClosed = false; }
  if(route === "sessions-closed"){ state.showClosed = true; }
  if(route === "sessions" || route === "sessions-closed"){ state.expandedSessions = new Set(["s1"]); }
  state.menu = null;
  state.envPop = false;
  render();
}
function navTo(route){
  if(state.route === route && !state.palette.open && !state.sheet.open){ setRoute(route); return; }
  if(location.hash === "#/" + route){ setRoute(route); return; }
  location.hash = "#/" + route;
}
window.addEventListener("hashchange", () => setRoute(parseRoute()));

/* ============================================================
   toast / 焦点
   ============================================================ */
const toastHandlers = new Map();
let toastSeq = 0;
function toast(text, opts){
  opts = opts || {};
  const id = "toast" + (++toastSeq);
  state.toasts.push({id, text, action:opts.action || null, icon:opts.icon || null, error:!!opts.error});
  if(state.toasts.length > 3) state.toasts.shift();
  if(opts.onAction) toastHandlers.set(id, opts.onAction);
  renderToasts();
  setTimeout(() => dismissToast(id), opts.action ? 6000 : 3200);
}
function dismissToast(id){
  state.toasts = state.toasts.filter(t => t.id !== id);
  toastHandlers.delete(id);
  renderToasts();
}
function captureFocusSelector(){
  const ae = document.activeElement;
  if(!ae || ae === document.body) return null;
  const row = ae.closest && ae.closest("[data-row]");
  if(row) return '[data-row][data-id="' + row.dataset.id + '"]';
  const act = ae.closest && ae.closest("[data-act]");
  if(act) return '[data-act="' + act.dataset.act + '"]' + (act.dataset.id ? '[data-id="' + act.dataset.id + '"]' : "");
  return null;
}
function restoreFocus(){
  const sel = state.returnFocusSel;
  state.returnFocusSel = null;
  if(!sel) return;
  const el = document.querySelector(sel);
  if(el) el.focus({preventScroll:true});
}
function focusCapture(){
  const el = $("#capture");
  if(!el) return;
  el.focus({preventScroll:true});
  try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
}
function closeMenu(){ state.menu = null; renderMenu(); }

  if(t.status === "done"){
    t.status = t._prev || "todo";
    if(t._prevRun){ t.run = t._prevRun; delete t._prevRun; }
    delete t._prev;
    render();
    return;
  }
  t._prev = t.status;
  t._prevRun = t.run || null;
  t.status = "done";
  t.run = null;
  render();
  toast("已完成「" + t.title + "」", {action:"撤销", onAction:() => {
    t.status = t._prev || "todo";
    if(t._prevRun) t.run = t._prevRun;
    delete t._prev; delete t._prevRun;
    render();
    toast("已撤销");
  }});
}
function markStatus(id, status){
  const t = taskById(id);
  if(!t) return;
  const prev = t.status;
  t.status = status;
  if(status !== "doing") t.run = null;
  render();
  const label = status === "blocked" ? "标为阻塞" : status === "cancelled" ? "取消" : "更新";
  toast("已" + label + "「" + t.title + "」", {action:"撤销", onAction:() => { t.status = prev; render(); toast("已撤销"); }});
}
function claimTask(id){

  t.owner = "你";

}
function requeueTask(id){
  const t = taskById(id);
  if(!t) return;
  t.status = "todo";
  t.run = null;
  render();

function deleteTask(id){
  const t = taskById(id);
  if(!t) return;
  const idx = state.tasks.indexOf(t);
  state.tasks = state.tasks.filter(x => x.id !== id);
  state.selected.delete(id);
  state.expanded.delete(id);
  render();
  toast("已删除「" + t.title + "」", {action:"撤销", onAction:() => {
    state.tasks.splice(idx, 0, t);
    render();
    toast("已恢复任务");
  }});
}
function bulkDone(){
  const ids = [...state.selected];
  if(!ids.length) return;
  const prev = ids.map(id => { const t = taskById(id); return t ? {t, status:t.status, run:t.run} : null; }).filter(Boolean);
  prev.forEach(p => { p.t.status = "done"; p.t.run = null; });
  render();
  toast("已完成 " + ids.length + " 项", {action:"撤销", onAction:() => { prev.forEach(p => { p.t.status = p.status; p.t.run = p.run; }); render(); toast("已撤销"); }});
}
function bulkDelete(){
  const ids = [...state.selected];
  if(!ids.length) return;
  const saved = ids.map(id => { const t = taskById(id); return t ? {t, idx:state.tasks.indexOf(t)} : null; }).filter(Boolean);
  state.tasks = state.tasks.filter(t => !state.selected.has(t.id));
  state.selected.clear();
  render();
  toast("已删除 " + saved.length + " 项", {action:"撤销", onAction:() => {
    saved.sort((a,b) => a.idx - b.idx).forEach(x => state.tasks.splice(x.idx, 0, x.t));
    render();
    toast("已恢复任务");
  }});
}
function interruptTask(id){

  render();
  toast("已中断执行 · 任务已放回队列", {action:"撤销", onAction:() => { t.run = prevRun; t.status = prevStatus; render(); toast("已撤销中断"); }});
}

function runAttention(i){
  const a = ATTENTION[i];
  if(!a) return;
  switch(a.act){
    case "attn-open": openTask("t1"); break;
    case "attn-requeue": requeueTask("t7"); break;
    case "attn-done": markStatus("t8","done"); break;
    case "attn-open-session": state.expandedSessions = new Set(["s3"]); navTo("sessions"); break;
    case "attn-log": toast("design preview 日志：EADDRINUSE :::4174 · 已重试 1 次"); break;
    case "attn-start": startServer("srv2"); break;
    default: break;
  }
}
let serverTimer = 0;
function startServer(id){
  const s = serverById(id);
  if(!s) return;
  if(s.phase === "ready"){ toast(s.name + " 已在运行"); return; }
  s.phase = "starting";
  s.startedSec = 0;
  s._token = (s._token || 0) + 1;
  const token = s._token;
  render();
  toast("正在启动 " + s.name + "…", {icon:"refresh"});
  clearTimeout(serverTimer);
  serverTimer = setTimeout(() => {
    if(s._token !== token) return;
    s.phase = "ready";
    s.startedSec = null;
    render();
    toast(s.name + " 已就绪 · " + s.port);
  }, 1200);
}
function toggleServer(id){
  const s = serverById(id);
  if(!s) return;
  if(s.phase === "ready"){ s.phase = "stopped"; render(); toast(s.name + " 已停止"); return; }
  if(s.phase === "starting"){
    s._token = (s._token || 0) + 1;
    s.phase = "stopped";
    render();
    toast("已取消 " + s.name + " 的启动");
    return;
  }
  startServer(id);
}

function handleAct(el, ev){
  const act = el.dataset.act;
  const id = el.dataset.id;
  switch(act){
    case "nav": navTo(el.dataset.route); break;
    case "theme": setThemePref(el.dataset.theme); break;
    case "copy-path": copyText("~/Projects/snippets/zvid/dsh-plugins"); toast("已复制路径", {icon:"checkCircle"}); break;
    case "refresh": manualRefresh(); break;
    case "demo-menu": state.menu = (state.menu && state.menu.type === "demo") ? null : {type:"demo"}; state.envPop = false; renderPop(); renderMenu(); break;
    case "ws-menu": state.menu = (state.menu && state.menu.type === "ws") ? null : {type:"ws"}; renderMenu(); break;
    case "ws-pick": { const name = el.dataset.name; state.menu = null; renderMenu(); toast(name === "dsh-plugins" ? "已在此工作区" : "已切换到「" + name + "」（演示）"); break; }
    case "palette-open": openPalette(); break;
    case "goto-filter": state.filter = el.dataset.filter || "all"; navTo("tasks"); break;
    case "filter": setFilter(el.dataset.filter); break;
    case "clear-task-search": state.taskQuery = ""; render({focusSel:"#task-search"}); break;
    case "task-search": break;
    case "sess-filter": state.sessionFilter = el.dataset.filter; render(); break;
    case "group-toggle": toggleGroup(el.dataset.group); break;
    case "group-ctl": toast("分组：按状态（原型固定）"); break;
    case "sort-ctl": toast("排序：优先级 > 更新时间"); break;
    case "view-list": navTo("tasks"); break;
    case "view-board": navTo("board"); break;
    case "new-task": if(!["tasks","tasks-expanded"].includes(state.route)) navTo("tasks"); setTimeout(focusCapture, 80); break;
    case "claim": claimTask(id); break;
    case "toggle": toggleDone(id); break;
    case "dispatch": openSheet(id); break;
    case "row-more": openRowMenu(el, id); break;
    case "delete": deleteTask(id); break;
    case "copy-link": copyText("dsh-hub://task/" + id); toast("已复制任务链接"); break;
    case "mark-blocked": markStatus(id, "blocked"); break;
    case "cancel-task": markStatus(id, "cancelled"); break;
    case "bulk-claim": toast("已把 " + state.selected.size + " 项指派给你"); break;
    case "bulk-done": bulkDone(); break;
    case "bulk-dispatch": { const first = [...state.selected][0]; if(first) openSheet(first); break; }
    case "bulk-delete": bulkDelete(); break;
    case "bulk-cancel": state.selected.clear(); render(); break;
    case "attn-open": case "attn-requeue": case "attn-done": case "attn-open-session": case "attn-log": case "attn-start": runAttention(+el.dataset.i); break;
    case "attn-more": toast("已暂时忽略这条提醒"); break;
    case "open-task": openTask(id); break;
    case "open-board-task": openTask(id); break;
    case "interrupt": interruptTask(id); break;
    case "server-toggle": toggleServer(id); break;
    case "server-log": { const s = serverById(id); toast(s && s.error ? "日志：" + s.error[0] : (s ? s.name + " 运行正常，暂无错误输出" : "日志")); break; }
    case "open-url": toast("演示：在浏览器打开 " + el.dataset.url); break;
    case "env-pop": state.envPop = !state.envPop; renderPop(); break;
    case "sheet-target": setSheetTarget(+el.dataset.target); break;
    case "sheet-close": closeSheet(); break;
    case "sheet-send": sheetSend(); break;
    case "palette-exec": paletteExec(+el.dataset.index); break;
    case "demo": applyDemo(el.dataset.demo); break;
    case "row-menu": rowMenuAction(el.dataset.demo, el.dataset.id); break;
    case "toast-action": { const fn = toastHandlers.get(el.dataset.id); if(fn) fn(); dismissToast(el.dataset.id); break; }
    case "open-session": toast("已打开会话"); break;
    case "session-interrupt": { const s = sessionById(id); if(s){ s.status = "idle"; render(); toast("已中断「" + s.title + "」"); } break; }
    case "session-close": { const s = sessionById(id); if(s){ s.status = "closed"; render(); toast("已关闭「" + s.title + "」 · 可在「显示已关闭」中查看"); } break; }
    case "session-reopen": { const s = sessionById(id); if(s){ s.status = "idle"; render(); toast("已重新打开「" + s.title + "」"); } break; }
    case "open-subchat": toast("已打开子会话"); break;
    case "sub-interrupt": setSubchatStatus(id, "idle", "已中断"); break;
    case "sub-close": setSubchatStatus(id, "closed", "已关闭"); break;
    case "sub-reopen": setSubchatStatus(id, "running", "已重新打开"); break;
    case "reply-send": sendReply(id); break;
    case "new-subchat": toast("已在「整理工作区路径的展示规则」下新建子会话"); break;
    case "retry": manualRefresh(); break;
    case "conflict-accept": state.demo = null; render(); toast("已采用最新版本"); break;
    case "conflict-retry": toast("已重试你的修改"); break;
    case "tpl": fillTemplate(el.textContent); break;
    case "file-accept": toast("已采用其他会话的最新版本"); break;
    case "file-overwrite": toast("已用当前内容覆盖"); break;
    case "rule-reset": toast("已恢复上次保存"); break;
    case "new-skill": toast("打开技能创建抽屉（演示）"); break;
    case "skill-more": toast("技能操作（演示）"); break;
    default: break;
  }
}

panelEl.addEventListener("keydown", e => {
  if(e.target.id === "capture"){
    if(e.key === "Enter"){ e.preventDefault(); createTask(); }
    else if(e.key === "Tab" && !state.captureDetail){ e.preventDefault(); state.captureDetail = true; render({focusSel:"#capture", caret:"end"}); }
    else if(e.key === "Escape"){ if(state.captureDetail){ state.captureDetail = false; render({focusSel:"#capture"}); } else e.target.blur(); }
    return;
  }
  if(e.target.dataset && e.target.dataset.act === "reply-input"){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendReply(e.target.dataset.id); }
    return;

function createTask(){
  const title = state.captureDraft.trim();
  if(!title) return;
  const t = {id:"nt" + Date.now(), title, status:"todo", prio: state.capturePrio || "normal", owner:"无人", updated:"刚刚"};
  const idx = state.tasks.findIndex(x => x.status === "todo");
  if(idx >= 0) state.tasks.splice(idx, 0, t); else state.tasks.unshift(t);
  state.captureDraft = "";
  state.captureDetail = false;
  state.highlightId = t.id;
  state.filter = "all";
  render();
  focusCapture();
  setTimeout(() => { state.highlightId = null; }, 700);
}

function cycleBoardStatus(id, dir){
  const t = taskById(id);
  if(!t) return;
  const order = ["todo","doing","blocked","done"];
  const i = Math.max(0, order.indexOf(t.status));
  t.status = order[(i + dir + order.length) % order.length];
  if(t.status !== "doing") t.run = null;
  render();
  requestAnimationFrame(() => {
    const card = document.querySelector('[data-act="open-board-task"][data-id="' + id + '"]');
    if(card) card.focus({preventScroll:true});
  });
  toast("状态已改为「" + ({todo:"待办",doing:"进行中",blocked:"阻塞",done:"已完成"})[t.status] + "」");
}
function activateRow(row){
  const kind = row.dataset.kind;
  const id = row.dataset.id;
  if(kind === "task" || kind === "run" || kind === "dense"){ if(kind !== "dense") openTask(id); }
  else if(kind === "session") toggleSession(id);
  else if(kind === "subchat") toast("子会话：按 Enter 查看时间线（演示）");
  else if(kind === "board-card") openTask(id);
  else if(kind === "attention") runAttention(+String(id).replace("att",""));
  else if(kind === "env"){ state.envPop = true; renderPop(); }
  else if(kind === "rule" || kind === "skill"){ toast("行内编辑（演示）"); }
}
function isTyping(el){
  if(!el) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable;
}
function visibleRows(){ return $$("[data-row]", contentEl); }
function moveRowFocus(delta){
  const rows = visibleRows();
  if(!rows.length) return;
  const active = document.activeElement;
  let i = rows.indexOf(active);
  if(i < 0) i = state.focusRow > 0 ? state.focusRow : (delta > 0 ? -1 : 0);
  i = Math.max(0, Math.min(rows.length - 1, i + delta));
  state.focusRow = i;
  rows[i].focus({preventScroll:true});
  rows[i].scrollIntoView({block:"nearest"});
}
function focusedRow(){ return document.activeElement && document.activeElement.closest ? document.activeElement.closest("[data-row]") : null; }
function trapTab(e, root){
  const els = Array.from(root.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
  if(!els.length) return;
  const first = els[0], last = els[els.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
document.addEventListener("keydown", e => {
  if(state.palette.open || state.sheet.open){
    if(e.key === "Escape"){ e.preventDefault(); if(state.palette.open) closePalette(); else closeSheet(); return; }
    if(state.palette.open){
      if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); movePalette(e.key === "ArrowDown" ? 1 : -1); }
      else if(e.key === "Enter"){ e.preventDefault(); paletteExec(state.palette.index); }
      else if(e.key === "Tab"){ e.preventDefault(); const inp = $("#pal-input"); if(inp) inp.focus(); }
      return;
    }
    if(state.sheet.open){
      const tag = e.target.tagName;
      if(tag !== "TEXTAREA" && tag !== "SELECT" && (e.key === "1" || e.key === "2" || e.key === "3")){ e.preventDefault(); setSheetTarget(+e.key); return; }
      if(e.key === "Enter"){
        const ae = document.activeElement;
        if(ae && ae.matches && ae.matches("button,a,input,select,textarea")) return;
        e.preventDefault(); sheetSend(); return;
      }
      if(e.key === "Tab"){ trapTab(e, $(".sheet")); return; }
      return;
    }
  }
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); return; }
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s"){ if(state.route === "settings"){ e.preventDefault(); saveRulesNow(); } return; }
  if(e.metaKey && e.key.toLowerCase() === "n"){ e.preventDefault(); if(!["tasks","tasks-expanded"].includes(state.route)) navTo("tasks"); setTimeout(focusCapture, 80); return; }
  if(e.key === "Escape"){
    if(state.menu){ closeMenu(); return; }
    if(state.envPop){ state.envPop = false; renderPop(); return; }
    if(isTyping(e.target)){ e.target.blur(); return; }
    return;
  }
  if(state.gPending){
    state.gPending = false;
    if(e.key === "o"){ e.preventDefault(); navTo("now"); return; }
    if(e.key === "t"){ e.preventDefault(); navTo("tasks"); return; }
    if(e.key === "c"){ e.preventDefault(); navTo("sessions"); return; }
    return;
  }
  if(isTyping(e.target)) return;
  if(e.key === "/"){ e.preventDefault(); focusSearch(); return; }
  if(e.key === "n"){ e.preventDefault(); if(!["tasks","tasks-expanded"].includes(state.route)) navTo("tasks"); setTimeout(focusCapture, 80); return; }
  if(e.key === "j" || e.key === "k"){ e.preventDefault(); moveRowFocus(e.key === "j" ? 1 : -1); return; }
  if(e.key === "Enter"){
    const row = focusedRow();
    if(row){ e.preventDefault(); activateRow(row); }
    return;
  }
  if(e.key === "x"){ const row = focusedRow(); if(row && row.dataset.kind === "task"){ e.preventDefault(); toggleDone(row.dataset.id); } return; }
  if(e.key === "e"){
    const row = focusedRow();
    if(row && row.dataset.kind === "task"){
      e.preventDefault();
      state.expanded = new Set([row.dataset.id]);
      render();
      requestAnimationFrame(() => { const inp = document.querySelector('[data-act="title-input"][data-id="' + row.dataset.id + '"]'); if(inp){ inp.focus(); inp.select && inp.select(); } });
    }
    return;
  }
  if(e.key === "d"){ const row = focusedRow(); if(row && row.dataset.kind === "task"){ e.preventDefault(); openSheet(row.dataset.id); } return; }
  if(e.key === "[" || e.key === "]"){
    const row = focusedRow();
    if(row && row.dataset.kind === "board-card"){
      e.preventDefault();
      cycleBoardStatus(row.dataset.id, e.key === "]" ? 1 : -1);
    }
    return;
  }
  if(e.key === "g"){ e.preventDefault(); state.gPending = true; setTimeout(() => { state.gPending = false; }, 900); return; }
});
function focusSearch(){
  if(state.route === "sessions" || state.route === "sessions-closed"){ const el = $("#sess-search"); if(el){ el.focus(); el.select && el.select(); } return; }
  if(state.route === "settings"){ const el = $("#skill-search"); if(el){ el.focus(); } return; }
  if(["tasks","tasks-selected","tasks-expanded"].includes(state.route)){
    const el = $("#task-search");
    if(el){ el.focus(); el.select && el.select(); return; }
    focusCapture(); return;
  }
  navTo("tasks");
  setTimeout(() => { const el = $("#task-search"); if(el) el.focus(); }, 100);
}

/* ============================================================
   启动
   ============================================================ */
(function boot(){
  const raw = (location.hash || "").replace(/^#\/?/, "");
  if(!ROUTES.includes(raw)){
    try{ history.replaceState(null, "", "#/now"); }catch(e){}
  }
  setRoute(ROUTES.includes(raw) ? raw : "now");
})();
</script>
